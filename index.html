<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P&amp;L Calendar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#0f1a33;--mut:#8a93a6;--bar:#f5f4fb;--line:#d9dce5;--gbg:#e8f7f0;--gfg:#1a9d6c;--rbg:#fdecee;--rfg:#c8324f;--acc:#1769d1;--seg:#f1f2f9;--card:#fff}
:root{--bg:#000;--fg:#fff;--mut:#8a93a6;--bar:#0c0f16;--line:#2a3040;--gbg:#051a0d;--gfg:#3de068;--rbg:#1c050b;--rfg:#ff2d55;--acc:#5ea2ff;--seg:#1a1f2b;--card:#12151d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto;padding:16px 4px 110px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:4px 4px 14px}
h1{font-size:23px;margin:0;font-weight:800;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 28px;gap:8px}
.mp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mp button{background:none;border:0;color:var(--fg);font-size:18px;padding:8px 12px}
.mp span{font-size:16px;min-width:84px;text-align:center}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);font-size:15px;padding:7px 14px;border-radius:8px;font-weight:500}
.seg button.on{background:var(--card);color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum{display:flex;gap:8px;margin:0 2px 30px}
.sum div{flex:1;background:var(--bar);border-radius:10px;padding:9px 10px}
.sum small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.sum b{font-size:16px}
.g{color:var(--gfg)}.r{color:var(--rfg)}
.sum .kb{background:#061a2c;border:1px solid #1aa3ff;box-shadow:0 0 14px rgba(26,163,255,.6),0 0 30px rgba(26,163,255,.3)}
.sum .kb small,.sum .kb b{color:#1aa3ff}.sum .kb b{text-shadow:0 0 8px rgba(26,163,255,.6)}
.tot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));min-width:190px;text-align:center;background:#160a28;border:1px solid #b45cff;border-radius:10px;padding:9px 20px;box-shadow:0 0 14px rgba(180,92,255,.6),0 0 30px rgba(180,92,255,.3);z-index:5}
.tot small{display:block;color:#b45cff;font-size:11px;margin-bottom:2px}
.tot b{font-size:18px;color:#b45cff;text-shadow:0 0 8px rgba(180,92,255,.6)}
.tot b.g{color:#3de068;text-shadow:0 0 8px rgba(61,224,104,.6)}.tot b.r{color:#ff2d55;text-shadow:0 0 8px rgba(255,45,85,.6)}
.sum .kb b .g,.sum .kb b .r{color:inherit;text-shadow:inherit}
.sum .kg{background:var(--gbg);border:1px solid #3de068;box-shadow:0 0 14px rgba(61,224,104,.6),0 0 30px rgba(61,224,104,.3)}.sum .kg small,.sum .kg b{color:#3de068}.sum .kg b{text-shadow:0 0 8px rgba(61,224,104,.6)}
.sum .kr{background:var(--rbg);border:1px solid #ff2d55;box-shadow:0 0 14px rgba(255,45,85,.6),0 0 30px rgba(255,45,85,.3)}.sum .kr small,.sum .kr b{color:#ff2d55}.sum .kr b{text-shadow:0 0 8px rgba(255,45,85,.6)}
.mk{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bar);border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:1.5px;color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.open{border-color:var(--gfg)}.pill.open .dot{background:var(--gfg)}
.cd{font-size:11px;letter-spacing:1.5px;color:var(--mut)}.cd b{color:#e0a100;font-variant-numeric:tabular-nums;letter-spacing:2px;font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{background:#2a2000;color:#ffd60a;font-size:11px;text-align:center;padding:9px 0;letter-spacing:.5px}
.c{aspect-ratio:1/1.15;border-radius:10px;overflow:hidden;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--fg);border:0;background:#1b2130;padding:0;font-family:inherit}
.c .n{color:var(--mut);font-size:14px;margin-bottom:4px}
.c .v{font-weight:700;font-size:11px}
.c.t{background:#0b3d66}.c.t .n{color:#1aa3ff;font-weight:700}
.c.p{background:var(--gbg)}.c.p .v{color:var(--gfg)}
.c.l{background:var(--rbg)}.c.l .v{color:var(--rfg)}
.c.e{visibility:hidden}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ym{border:0;border-radius:10px;padding:16px 6px;background:var(--bar);color:var(--fg);font-family:inherit}
.ym.p{background:var(--gbg)}.ym.l{background:var(--rbg)}
.ym small{display:block;color:var(--mut);margin-bottom:5px;font-size:13px}
.ym b{font-size:14px}.ym.p b{color:var(--gfg)}.ym.l b{color:var(--rfg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:20}
.ov.show{display:flex}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:0 0 18px 18px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 20px}
.sh h2{margin:0 0 14px;font-size:18px}
.pl{display:flex;gap:8px;margin-bottom:12px}
.pl button{flex:1;padding:11px;border-radius:10px;border:2px solid var(--line);background:none;color:var(--fg);font-size:15px;font-weight:600;font-family:inherit}
.pl button.pp.on{border-color:var(--gfg);background:var(--gbg);color:var(--gfg)}
.pl button.ll.on{border-color:var(--rfg);background:var(--rbg);color:var(--rfg)}
.sh input{width:100%;font-size:24px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:inherit}
.act{display:flex;gap:8px;margin-top:14px}
.act button{flex:1;padding:13px;border-radius:10px;border:0;font-size:15px;font-weight:700;font-family:inherit}
.sv{background:var(--acc);color:#fff}.cl{background:var(--seg);color:var(--rfg)}.cn{background:var(--seg);color:var(--fg)}

body.locked{overflow:hidden;height:100vh}
#lock{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px calc(60px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px))}
#lock.hide{display:none}
.lt{font-family:"Dancing Script","Brush Script MT",cursive;font-size:min(13vw,56px);font-weight:600;color:#fff700;text-shadow:0 0 6px #fff700,0 0 16px rgba(255,230,0,.8),0 0 34px rgba(255,200,0,.6);margin:0 0 18px;text-align:center;line-height:1.1;white-space:nowrap}
.li{width:min(72vw,320px);height:auto;display:block;margin-bottom:34px;mix-blend-mode:screen}
.lp{color:#3dff2a;letter-spacing:4px;font-size:15px;text-shadow:0 0 8px rgba(61,255,42,.8);margin-bottom:16px}
.ld{display:flex;gap:14px;margin-bottom:24px}
.ld div{width:62px;height:62px;border:2px solid #3dff2a;border-radius:20px;background:#020a02;box-shadow:0 0 10px rgba(61,255,42,.6),inset 0 0 8px rgba(61,255,42,.2);display:flex;align-items:center;justify-content:center;color:#3dff2a;font-size:26px;text-shadow:0 0 8px #3dff2a}
.ld.err div{border-color:#ff2d55;color:#ff2d55;box-shadow:0 0 10px rgba(255,45,85,.7),inset 0 0 8px rgba(255,45,85,.25);text-shadow:0 0 8px #ff2d55}
.ld.err{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lb{font-family:inherit;letter-spacing:4px;font-weight:700;font-size:20px;padding:14px 46px;border-radius:18px;border:2px solid rgba(255,230,0,.3);background:rgba(255,230,0,.04);color:rgba(255,230,0,.35);box-shadow:0 0 10px rgba(255,230,0,.12)}
.lb.on{border-color:#fff700;color:#fff700;background:rgba(255,230,0,.1);box-shadow:0 0 14px rgba(255,230,0,.6)}
.lm{height:22px;margin-top:14px;color:#ff2d55;font-size:14px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,45,85,.7)}
#pin{position:absolute;left:50%;top:50%;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
#pad{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding-bottom:6vh}
#pad.show{display:flex}
.pg{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pg button{width:74px;height:74px;border-radius:50%;border:1.5px solid #3dff2a;background:rgba(20,80,10,.35);color:#3dff2a;font-family:inherit;font-weight:700;font-size:32px;text-shadow:0 0 10px #3dff2a;box-shadow:0 0 14px rgba(61,255,42,.45),inset 0 0 12px rgba(61,255,42,.2);touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0}
.pg button:active{background:rgba(61,255,42,.3)}
</style>
</head>

  var h="",s="";
  if(mode=="month"){
    var n=new Date(Y,M+1,0).getDate(),off=new Date(Y,M,1).getDay(),w=0,l=0,tot=0;
    for(var d=1;d<=n;d++){var v=data[key(Y,M,d)];if(v!==undefined){tot+=v;if(v>0)w++;else if(v<0)l++}}
    s='<div class="kb"><small>Month P&amp;L</small><b>'+mp(tot)+'</b></div><div class="kg"><small>Green days</small><b class="g">'+w+'</b></div><div class="kr"><small>Red days</small><b class="r">'+l+'</b></div>';
    h='<div class="grid">';
    ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(function(x){h+='<div class="wd">'+x+'</div>'});
    for(var i=0;i<off;i++)h+='<div class="c e"></div>';
    for(var d=1;d<=n;d++){
      var k=key(Y,M,d),v=data[k],isT=(Y==now.getFullYear()&&M==now.getMonth()&&d==now.getDate());
      h+='<button class="c '+(v!==undefined?cls(v):"")+(isT?" t":"")+'" data-d="'+d+'"><span class="n">'+(isT?"Today":d)+'</span><span class="v">'+(v!==undefined?fmt(v):"")+'</span></button>';
    }
    h+='</div>';
  }else{
    var yt=0;for(var m=0;m<12;m++)yt+=monthTotal(Y,m).t;
    s='<div class="kb"><small>Year P&amp;L</small><b>'+mp(yt)+'</b></div>';
    h='<div class="ygrid">';
    for(var m=0;m<12;m++){var o=monthTotal(Y,m);h+='<button class="ym '+(o.c?cls(o.t):"")+'" data-m="'+m+'"><small>'+MN[m].slice(0,3)+'</small><b>'+(o.c?fmt(o.t):"--")+'</b></button>'}
    h+='</div>';
  }
  $("sum").innerHTML=s;$("main").innerHTML=h;totalBox();
}
$("main").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.m!==undefined){M=+b.dataset.m;mode="month";render();return}
  if(b.dataset.d!==undefined)openSheet(+b.dataset.d);
});
function setSign(s){sign=s;$("bp").className="pp"+(s>0?" on":"");$("bl").className="ll"+(s<0?" on":"")}
function openSheet(d){
  sel=key(Y,M,d);$("sd").textContent=MN[M]+" "+d+", "+Y;
  var v=data[sel];setSign(v!==undefined&&v<0?-1:1);
  $("amt").value=v!==undefined?Math.abs(v):"";
  $("cl").style.display=v!==undefined?"":"none";
  $("ov").className="ov show";setTimeout(function(){$("amt").focus()},50);
}
function closeSheet(){$("ov").className="ov"}
$("bp").onclick=function(){setSign(1);$("amt").focus()};$("bl").onclick=function(){setSign(-1);$("amt").focus()};
["bp","bl"].forEach(function(i){$(i).addEventListener("mousedown",function(e){e.preventDefault()})});
$("cn").onclick=closeSheet;
$("amt").addEventListener("keydown",function(e){if(e.key==="Enter")$("sv").click()});
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeSheet()});
$("sv").onclick=function(){
  var a=parseFloat($("amt").value);if(isNaN(a))return;
  data[sel]=Math.round(a*sign*100)/100;persist();closeSheet();render();
};
$("cl").onclick=function(){delete data[sel];persist();closeSheet();render()};
$("prev").onclick=function(){if(mode=="month"){M--;if(M<0){M=11;Y--}}else Y--;render()};
$("next").onclick=function(){if(mode=="month"){M++;if(M>11){M=0;Y++}}else Y++;render()};
$("bm").onclick=function(){mode="month";render()};
$("by").onclick=function(){mode="year";render()};
var lk=$("lock"),dts=lk.querySelectorAll(".ld div"),PIN="1989",pv="";
function lockUpd(){for(var i=0;i<dts.length;i++)dts[i].textContent=i<pv.length?"\u25CF":"";$("lb").className="lb"+(pv.length==4?" on":"")}
function openPad(){$("pad").className="show"}
function closePad(){$("pad").className=""}
function doLock(){pv="";lockUpd();$("ld").className="ld";$("lm").textContent="";lk.className="";document.body.classList.add("locked")}
function tryUnlock(){
  if(pv===PIN){lk.className="hide";closePad();document.body.classList.remove("locked");pv="";lockUpd();return}
  closePad();
  if(pv.length<4){$("lm").textContent="ENTER 4 DIGITS";setTimeout(function(){$("lm").textContent=""},900);return}
  $("ld").className="ld err";$("lm").textContent="WRONG PIN";
  setTimeout(function(){pv="";lockUpd();$("ld").className="ld";$("lm").textContent=""},800);
}
$("pad").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var k=b.dataset.k;
  if(k=="x"){closePad();return}
  if(k=="b"){pv=pv.slice(0,-1)}else if(pv.length<4){pv+=k}
  lockUpd();if(pv.length==4)closePad()});
$("ld").addEventListener("click",openPad);
$("lb").addEventListener("click",tryUnlock);
document.addEventListener("visibilitychange",function(){if(document.hidden)doLock()});
function mp(v){var m=money(v),c=m.charAt(0);return '<span class="'+(c=="+"?"g":"r")+'">'+c+'</span>'+m.slice(1)}
function totalBox(){var t=0,k;for(k in data)t+=data[k];t=Math.round(t*100)/100;$("tot").innerHTML='<small>Total P&amp;L</small><b class="'+(t>0?"g":t<0?"r":"")+'">'+money(t)+'</b>'}
var CL=["2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24"],EC=["2026-11-27","2026-12-24","2027-11-26"];
function etNow(){var o={};new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date()).forEach(function(x){o[x.type]=x.value});return{y:+o.year,m:+o.month,d:+o.day,s:(+o.hour)*3600+(+o.minute)*60+(+o.second)}}
function dk(dt){return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}
function tday(dt){var w=dt.getUTCDay();return w>0&&w<6&&CL.indexOf(dk(dt))<0}
function csec(dt){return EC.indexOf(dk(dt))>=0?46800:57600}
function tick(){
  var n=etNow(),dt=new Date(Date.UTC(n.y,n.m-1,n.d)),open=false,rem;
  if(tday(dt)){
    if(n.s>=34200&&n.s<csec(dt)){open=true;rem=csec(dt)-n.s}
    else if(n.s<34200){rem=34200-n.s}
  }
  if(rem===undefined){var days=0;do{dt=new Date(dt.getTime()+86400000);days++}while(!tday(dt));rem=(86400-n.s)+(days-1)*86400+34200}
  var h=Math.floor(rem/3600),m=Math.floor(rem%3600/60),s=rem%60,t;
  t=h>=24?Math.floor(h/24)+"D "+pad(h%24)+":"+pad(m)+":"+pad(s):pad(h)+":"+pad(m)+":"+pad(s);
  $("mk").innerHTML='<div class="pill'+(open?" open":"")+'"><span class="dot"></span>MARKET '+(open?"OPEN":"CLOSED")+'</div><div class="cd">'+(open?"CLOSES IN ":"OPENS IN ")+'<b>'+t+'</b></div>';
}
setInterval(tick,1000);tick();
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
