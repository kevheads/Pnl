<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P&amp;L Calendar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#0f1a33;--mut:#8a93a6;--bar:#f5f4fb;--line:#d9dce5;--gbg:#e8f7f0;--gfg:#1a9d6c;--rbg:#fdecee;--rfg:#c8324f;--acc:#1769d1;--seg:#f1f2f9;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--fg:#eef1f8;--mut:#7d869a;--bar:#181c26;--line:#2a3040;--gbg:#12301f;--gfg:#35c98a;--rbg:#3a1a22;--rfg:#ff6b85;--acc:#5ea2ff;--seg:#1a1f2b;--card:#1a1f2b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:26px;margin:4px 4px 14px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 14px;gap:8px}
.mp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mp button{background:none;border:0;color:var(--fg);font-size:18px;padding:8px 12px}
.mp span{font-size:16px;min-width:84px;text-align:center}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:4px}
.seg button{border:0;background:none;color:var(--mut);font-size:15px;padding:7px 14px;border-radius:8px;font-weight:500}
.seg button.on{background:var(--card);color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum{display:flex;gap:8px;margin:0 2px 14px}
.sum div{flex:1;background:var(--bar);border-radius:10px;padding:9px 10px}
.sum small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.sum b{font-size:16px}
.g{color:var(--gfg)}.r{color:var(--rfg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{background:var(--bar);color:var(--mut);font-size:11px;text-align:center;padding:9px 0;letter-spacing:.5px}
.c{aspect-ratio:1/1.05;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--fg);border:0;background:none;padding:0;font-family:inherit}
.c .n{color:var(--mut);font-size:13px;margin-bottom:3px}
.c .v{font-weight:700;font-size:11.5px}
.c.p{background:var(--gbg)}.c.p .v{color:var(--gfg)}
.c.l{background:var(--rbg)}.c.l .v{color:var(--rfg)}
.c.t .n{color:var(--fg);font-weight:600}
.c.e{visibility:hidden}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ym{border:0;border-radius:10px;padding:16px 6px;background:var(--bar);color:var(--fg);font-family:inherit}
.ym.p{background:var(--gbg)}.ym.l{background:var(--rbg)}
.ym small{display:block;color:var(--mut);margin-bottom:5px;font-size:13px}
.ym b{font-size:14px}.ym.p b{color:var(--gfg)}.ym.l b{color:var(--rfg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 14px;font-size:18px}
.pl{display:flex;gap:8px;margin-bottom:12px}
.pl button{flex:1;padding:11px;border-radius:10px;border:2px solid var(--line);background:none;color:var(--fg);font-size:15px;font-weight:600;font-family:inherit}
.pl button.pp.on{border-color:var(--gfg);background:var(--gbg);color:var(--gfg)}
.pl button.ll.on{border-color:var(--rfg);background:var(--rbg);color:var(--rfg)}
.sh input{width:100%;font-size:24px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:inherit}
.act{display:flex;gap:8px;margin-top:14px}
.act button{flex:1;padding:13px;border-radius:10px;border:0;font-size:15px;font-weight:700;font-family:inherit}
.sv{background:var(--acc);color:#fff}.cl{background:var(--seg);color:var(--rfg)}.cn{background:var(--seg);color:var(--fg)}
</style>
</head>
<body>
<h1>P&amp;L Calendar</h1>
<div class="top">
  <div class="mp"><button id="prev" aria-label="Previous">‹</button><span id="lbl"></span><button id="next" aria-label="Next">›</button></div>
  <div class="seg"><button id="bm" class="on">Month</button><button id="by">Year</button></div>
</div>
<div class="sum" id="sum"></div>
<div id="main"></div>

<div class="ov" id="ov"><div class="sh">
  <h2 id="sd"></h2>
  <div class="pl"><button class="pp on" id="bp">Profit</button><button class="ll" id="bl">Loss</button></div>
  <input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
  <div class="act"><button class="cn" id="cn">Cancel</button><button class="cl" id="cl">Clear</button><button class="sv" id="sv">Save</button></div>
</div></div>

<script>
var KEY="pnl-calendar-v1",data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),mode="month",sel=null,sign=1;
var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function pad(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function fmt(v){var s=v<0?"-":"+",a=Math.abs(v);return s+(a>=1000?(a/1000).toFixed(2)+"K":a.toFixed(2))}
function money(v){var s=v<0?"-":"+";return s+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function cls(v){return v>0?"p":v<0?"l":""}
function $(i){return document.getElementById(i)}
function monthTotal(y,m){var t=0,c=0,n=new Date(y,m+1,0).getDate();for(var d=1;d<=n;d++){var v=data[key(y,m,d)];if(v!==undefined){t+=v;c++}}return{t:t,c:c}}
function render(){
  $("bm").className=mode=="month"?"on":"";$("by").className=mode=="year"?"on":"";
  $("lbl").textContent=mode=="month"?Y+"-"+pad(M+1):Y;
  var h="",s="";
  if(mode=="month"){
    var n=new Date(Y,M+1,0).getDate(),off=new Date(Y,M,1).getDay(),w=0,l=0,tot=0;
    for(var d=1;d<=n;d++){var v=data[key(Y,M,d)];if(v!==undefined){tot+=v;if(v>0)w++;else if(v<0)l++}}
    s='<div><small>Month P&amp;L</small><b class="'+(tot>=0?"g":"r")+'">'+money(tot)+'</b></div><div><small>Green days</small><b class="g">'+w+'</b></div><div><small>Red days</small><b class="r">'+l+'</b></div>';
    h='<div class="grid">';
    ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(function(x){h+='<div class="wd">'+x+'</div>'});
    for(var i=0;i<off;i++)h+='<div class="c e"></div>';
    for(var d=1;d<=n;d++){
      var k=key(Y,M,d),v=data[k],isT=(Y==now.getFullYear()&&M==now.getMonth()&&d==now.getDate());
      h+='<button class="c '+(v!==undefined?cls(v):"")+(isT?" t":"")+'" data-d="'+d+'"><span class="n">'+(isT?"Today":d)+'</span><span class="v">'+(v!==undefined?fmt(v):"")+'</span></button>';
    }
    h+='</div>';
  }else{
    var yt=0;for(var m=0;m<12;m++)yt+=monthTotal(Y,m).t;
    s='<div><small>Year P&amp;L</small><b class="'+(yt>=0?"g":"r")+'">'+money(yt)+'</b></div>';
    h='<div class="ygrid">';
    for(var m=0;m<12;m++){var o=monthTotal(Y,m);h+='<button class="ym '+(o.c?cls(o.t):"")+'" data-m="'+m+'"><small>'+MN[m].slice(0,3)+'</small><b>'+(o.c?fmt(o.t):"--")+'</b></button>'}
    h+='</div>';
  }
  $("sum").innerHTML=s;$("main").innerHTML=h;
}
$("main").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.m!==undefined){M=+b.dataset.m;mode="month";render();return}
  if(b.dataset.d!==undefined)openSheet(+b.dataset.d);
});
function setSign(s){sign=s;$("bp").className="pp"+(s>0?" on":"");$("bl").className="ll"+(s<0?" on":"")}
function openSheet(d){
  sel=key(Y,M,d);$("sd").textContent=MN[M]+" "+d+", "+Y;
  var v=data[sel];setSign(v!==undefined&&v<0?-1:1);
  $("amt").value=v!==undefined?Math.abs(v):"";
  $("cl").style.display=v!==undefined?"":"none";
  $("ov").className="ov show";setTimeout(function(){$("amt").focus()},50);
}
function closeSheet(){$("ov").className="ov"}
$("bp").onclick=function(){setSign(1)};$("bl").onclick=function(){setSign(-1)};
$("cn").onclick=closeSheet;
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeSheet()});
$("sv").onclick=function(){
  var a=parseFloat($("amt").value);if(isNaN(a))return;
  data[sel]=Math.round(a*sign*100)/100;persist();closeSheet();render();
};
$("cl").onclick=function(){delete data[sel];persist();closeSheet();render()};
$("prev").onclick=function(){if(mode=="month"){M--;if(M<0){M=11;Y--}}else Y--;render()};
$("next").onclick=function(){if(mode=="month"){M++;if(M>11){M=0;Y++}}else Y++;render()};
$("bm").onclick=function(){mode="month";render()};
$("by").onclick=function(){mode="year";render()};
render();
</script>
</body>
</html>
